<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muktar POS · 3 Branches</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mu:#6b7a88;--pr:#0a7d4f;--pt:#fff;--bd:#dde3e8;--rd:#c62828;--am:#b26a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101619;--card:#1a2328;--tx:#e9eef2;--mu:#93a2ae;--pr:#2fbf83;--pt:#06231a;--bd:#2b3841;--rd:#ef6b6b;--am:#e7a93b}}
:root[data-theme="dark"]{--bg:#101619;--card:#1a2328;--tx:#e9eef2;--mu:#93a2ae;--pr:#2fbf83;--pt:#06231a;--bd:#2b3841;--rd:#ef6b6b;--am:#e7a93b}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:70px}
header{padding:12px 14px;font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center}header small{font-weight:400;color:var(--mu)}
main{padding:0 12px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%;margin:3px 0}
button{background:var(--pr);color:var(--pt);border:0;font-weight:600;cursor:pointer}button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.s{flex:0 0 auto;width:auto}
.item{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.mu{color:var(--mu);font-size:13px}.b{font-weight:600}.low{color:var(--am)}.out{color:var(--rd)}
.tot{font-size:22px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.grid .card{margin:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;color:var(--mu);border-radius:0;border:0;padding:10px 0;font-size:11px;margin:0}nav button.on{color:var(--pr);font-weight:800}
h3{margin:4px 0 8px;font-size:15px}.tag{font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--bd)}
.ai{border-left:4px solid var(--pr)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips button{width:auto;padding:6px 10px;font-size:13px}
pre{white-space:pre-wrap;font:inherit;margin:6px 0}
@media print{body *{visibility:hidden}#rcp,#rcp *{visibility:visible}#rcp{position:fixed;left:0;top:0;width:100%}}
.w{width:auto!important;white-space:nowrap}
.pi{width:44px;height:44px;border-radius:9px;object-fit:cover;flex:0 0 44px;background:var(--bd)}.pi+div{flex:1}.ov{position:fixed;inset:0;z-index:20;background:var(--bg);padding:16px;overflow:auto}.chips button.g{width:auto}
</style></head><body>
<header><span id="ttl">📱 Muktar POS</span><small id="who"></small></header>
<main id="app"></main><nav id="nav"></nav>
<script>
var OWNER_WA="254727734877",KEY="muktar_pos_v2",me=null,tab="sell",cart=[],q="",toast="",ans="",tries=0,lock=0,idle;
var D={shop:"My Shop",O:null,U:[],P:[],S:[],E:[],L:[],n:1,maxDisc:5};
function load(){try{var r=localStorage.getItem(KEY);if(r)D=JSON.parse(r)}catch(e){}}
function save(){try{fixP()}catch(e){}try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}cloudPush()}
function $(i){return document.getElementById(i)}
function v(i){return $(i)?$(i).value.trim():""}
function k(n){return"KSh "+Math.round(n).toLocaleString("en-KE")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function day(t){return new Date(t).toLocaleDateString("en-CA",{timeZone:"Africa/Nairobi"})}
function today(){return day(Date.now())}
function tm(t){return new Date(t).toLocaleTimeString("en-KE",{timeZone:"Africa/Nairobi",hour:"2-digit",minute:"2-digit"})}
function P(id){return D.P.find(function(p){return p.id==id})}
function isO(){return me&&me.role=="owner"}
function wa(m,to){window.open("https://wa.me/"+(to===undefined?OWNER_WA:to)+"?text="+encodeURIComponent(m),"_blank")}
function lg(a){D.L.unshift({t:Date.now(),u:me?me.name:"-",a:a});D.L=D.L.slice(0,200)}
function say(m){toast=m;render();setTimeout(function(){toast="";render()},2200)}
async function hs(s){try{var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("mk|"+s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}catch(e){return"p|"+btoa(unescape(encodeURIComponent(s)))}}
async function dlf(n,t){try{var d=await window.claude.use("downloads");if(!d)return say("Download not available here");await d.save({filename:n,data:t})}catch(e){say("Download cancelled")}}
function dl(){dlf("muktar-pos-backup-"+today()+".json",JSON.stringify(D))}
function cv(a){return a.map(function(x){return'"'+String(x==null?"":x).replace(/"/g,'""')+'"'}).join(",")}
function dlCsv(w){if(w=="stock")return dlf("stock-"+today()+".csv",[cv(["Name","SKU","Category","Cost","Price","Stock","Reorder"].concat(D.B.map(function(b){return b.n})))].concat(D.P.map(function(p){return cv([p.n,p.sku,p.c,p.cost,p.price,p.stock,p.min].concat(D.B.map(function(b){return(p.bs||{})[b.id]||0})))})).join("\n"));
 dlf("sales-"+today()+".csv",[cv(["Sale","Date","Time","Seller","Items","Payment","Discount","Total","Customer","Refunded","Paid","Shift","Branch"])].concat(D.S.map(function(x){return cv([x.id,day(x.t),tm(x.t),x.byn,x.items.map(function(i){return i.q+"x "+i.n}).join("; "),x.pay,x.disc,x.total,x.cust,x.ref?"yes":"no",x.paid?"yes":"no",x.sh||"",bn(x.br)])})).join("\n"))}
function bump(){clearTimeout(idle);if(me)idle=setTimeout(function(){me=null;cart=[];render()},600000)}
document.addEventListener("click",bump);

/* ---- AUTH ---- */
async function setup(){var n=v("sn"),o=v("on"),p=$("sp").value;if(!n||!o||p.length<4)return say("Fill everything. Password min 4 characters");
 D.shop=n;D.logo=Math.floor(Math.random()*90000)+7;D.O={id:0,name:o,role:"owner",h:await hs(p)};save();me=D.O;lg("Shop created");save();tab="sell";bump();render()}
async function login(){if(Date.now()<lock)return say("Too many tries. Wait "+Math.ceil((lock-Date.now())/1000)+"s");
 var id=+$("lu").value,u=id==0?D.O:D.U.find(function(w){return w.id==id});
 if(u&&u.h==await hs($("lp").value)){tries=0;me=u;tab="sell";lg("Logged in");save();bump();render()}
 else{if(++tries>=5){lock=Date.now()+30000;tries=0}say("Wrong password")}}
function logout(){me=null;cart=[];render()}
async function addW(){if(D.U.length>=12)return say("Maximum 12 workers");var n=v("wn"),p=$("wp").value;
 if(!n||p.length<4)return say("Name and password (min 4)");if([D.O].concat(D.U).some(function(u){return u.name.toLowerCase()==n.toLowerCase()}))return say("Name already used");
 D.U.push({id:D.n++,name:n,role:"seller",br:+($("wb")?$("wb").value:CB)||1,h:await hs(p)});lg("Added worker "+n);save();render()}
async function resetW(id){var p=prompt("New password for this worker (min 4)");if(!p||p.length<4)return;D.U.find(function(w){return w.id==id}).h=await hs(p);lg("Reset worker password");save();say("Password changed")}
function delW(id){var w=D.U.find(function(x){return x.id==id});if(confirm("Remove "+w.name+"? Their past sales stay in reports.")){D.U=D.U.filter(function(x){return x.id!=id});lg("Removed "+w.name);save();render()}}
async function myPw(){var p=prompt("New owner password (min 4)");if(!p||p.length<4)return;D.O.h=await hs(p);save();say("Owner password changed")}

function sf(){D.SH=D.SH||[];D.sh=D.sh||{}}
function shStats(h,end){sf();var S=D.S.filter(function(x){return x.sh==h.id}),by={},cs=0,rev=0,n=0;S.forEach(function(x){if(x.pay=="CASH")cs+=x.total;if(!x.ref){rev+=x.total;n++;by[x.pay]=(by[x.pay]||0)+x.total}});
 var cr=D.S.filter(function(x){return x.ref&&x.pay=="CASH"&&x.rt>=h.t&&x.rt<=end}).reduce(function(a,x){return a+x.total},0),
 pc=D.S.filter(function(x){return x.pay=="CREDIT"&&x.paid&&!x.ref&&x.pm=="CASH"&&x.pt>=h.t&&x.pt<=end}).reduce(function(a,x){return a+x.total},0);
 return{n:n,rev:rev,by:by,exp:h.fl+cs-cr+pc}}
function openShift(){sf();if(D.sh[me.id])return;var f=v("ofl")||"0";if(isNaN(+f)||+f<0)return say("Enter a valid opening cash amount");D.sh[me.id]={id:D.n++,t:Date.now(),u:me.id,un:me.name,fl:+f,br:CB};lg("Opened shift");save();say("Shift opened")}
function closeShift(){sf();var h=D.sh[me.id];if(!h)return;var st=shStats(h,Date.now()),c=v("ccnt");if(c===""||isNaN(+c)||+c<0)return say("Enter the cash you counted in the till");
 h.end=Date.now();h.cnt=+c;h.exp=st.exp;h.vr=+c-st.exp;h.n=st.n;h.rev=st.rev;h.m=st.by;delete D.sh[me.id];D.SH.unshift(h);D.SH=D.SH.slice(0,100);lg("Closed shift "+(h.vr?"variance "+k(h.vr):"balanced"));save();say("Shift closed")}
function shText(h){var L="----------------";return D.shop.toUpperCase()+"\nSHIFT REPORT\n"+L+"\nStaff: "+h.un+"\nOpened: "+day(h.t)+" "+tm(h.t)+"\nClosed: "+day(h.end)+" "+tm(h.end)+"\n"+L+"\nSales: "+h.n+" · "+k(h.rev)+"\n"+(Object.keys(h.m||{}).map(function(x){return x+": "+k(h.m[x])}).join("\n")||"No sales")+"\n"+L+"\nOpening cash: "+k(h.fl)+"\nExpected cash: "+k(h.exp)+"\nCounted cash: "+k(h.cnt)+"\nDifference: "+(h.vr>0?"+":"")+k(h.vr)+(h.vr<0?" (SHORT)":h.vr>0?" (OVER)":" (balanced)")}
function shFind(id){return D.SH.find(function(x){return x.id==id})}
function shCard(){sf();var h=D.sh[me.id],H=D.SH.filter(function(x){return isO()||x.u==me.id}).slice(0,5),st=h&&shStats(h,Date.now());
 return'<div class="card">'+(h?'<div class="row"><div><div class="b">🟢 Shift open · '+tm(h.t)+'</div><div class="mu">Float '+k(h.fl)+' · '+st.n+' sales · '+k(st.rev)+'</div></div></div><div class="row"><input id="ccnt" type="number" inputmode="numeric" placeholder="Cash counted in till"><button class="s w" onclick="closeShift()">Close shift</button></div>':'<div class="row"><div><div class="b">🔴 No open shift</div><div class="mu">Open a shift to start selling.</div></div></div><div class="row"><input id="ofl" type="number" inputmode="numeric" placeholder="Opening cash in till (0 if none)"><button class="s w" onclick="openShift()">Open shift</button></div>')+
 H.map(function(x){return'<div class="item"><div><div class="b">'+esc(x.un)+' · '+day(x.t)+'</div><div class="mu">'+x.n+' sales · '+k(x.rev)+' · <span class="'+(x.vr<0?"out":x.vr>0?"low":"")+'">'+(x.vr?(x.vr>0?"+":"")+k(x.vr):"balanced")+'</span></div></div><span style="display:flex;gap:6px"><button class="g s w" onclick="dlf(\'shift-'+x.id+'.txt\',shText(shFind('+x.id+')))">⬇️</button><button class="g s w" onclick="wa(shText(shFind('+x.id+')))">📲</button></span></div>'}).join("")+'</div>'}
/* ---- SELL ---- */
function sub(){return cart.reduce(function(a,i){return a+i.q*i.price},0)}
function add(id){var p=P(id),c=cart.find(function(i){return i.id==id});if((c?c.q:0)>=p.stock)return say("Not enough stock: "+p.n);if(c)c.q++;else cart.push({id:id,n:p.n,q:1,price:p.price,cost:p.cost});render()}
function qty(id,d){var c=cart.find(function(i){return i.id==id});if(!c)return;if(!P(id)){cart=cart.filter(function(i){return i.id!=id});return render()}c.q+=d;if(c.q>P(id).stock)c.q=P(id).stock;if(c.q<1)cart=cart.filter(function(i){return i.id!=id});render()}
function checkout(){if(!cart.length)return;sf();if(!D.sh[me.id])return say("Open your shift first");var d=Math.max(0,+v("disc")||0),s0=sub(),pay=$("pay").value,cu=v("cust");
 if(d>s0)return say("Discount too big");if(!isO()&&d>s0*D.maxDisc/100)return say("Your max discount is "+D.maxDisc+"% ("+k(s0*D.maxDisc/100)+"). Ask the owner.");
 if(pay=="CREDIT"&&!cu)return say("Enter customer name/phone for credit");
 var s={id:D.n++,t:Date.now(),by:me.id,byn:me.name,items:cart.map(function(i){return{id:i.id,n:i.n,q:i.q,price:i.price,cost:i.cost}}),disc:d,pay:pay,total:s0-d,cust:cu,sh:D.sh[me.id].id,br:CB,ref:false,paid:pay!="CREDIT"};
 s.items.forEach(function(i){var p=P(i.id);if(p)p.stock-=i.q});D.S.unshift(s);cart=[];lg("Sale #"+s.id+" "+k(s.total));save();
 var ph=cu.replace(/\D/g,"");if(ph.length==10&&ph[0]=="0")ph="254"+ph.slice(1);
 rc=s.id;render()}
function vSell(){var f=D.P.filter(function(p){return(p.n+p.c).toLowerCase().indexOf(q.toLowerCase())>=0}).slice(0,30),s0=sub();
 return shCard()+'<div class="card"><input id="q" placeholder="🔍 Search product..." value="'+esc(q)+'" oninput="q=this.value;keep()">'+
 (D.P.length?f.map(function(p){return'<div class="item" onclick="add('+p.id+')"><div><div class="b">'+esc(p.n)+'</div><div class="mu">'+esc(p.c)+' · <span class="'+(p.stock<=0?"out":p.stock<=p.min?"low":"")+'">'+p.stock+' in stock</span></div></div><div class="b">'+k(p.price)+'</div></div>'}).join(""):'<div class="mu">'+(isO()?"No products yet. Go to 📦 Stock and add your first product.":"No products yet. Ask the owner to add stock.")+'</div>')+'</div>'+
 '<div class="card"><h3>🛒 Cart</h3>'+(cart.length?cart.map(function(i){return'<div class="item"><div>'+esc(i.n)+'<div class="mu">'+k(i.price)+' each</div></div><div style="white-space:nowrap"><button class="g s" onclick="qty('+i.id+',-1)">−</button> <b>'+i.q+'</b> <button class="g s" onclick="qty('+i.id+',1)">+</button></div></div>'}).join("")+
 '<div class="row"><input id="disc" type="number" inputmode="numeric" placeholder="Discount KSh'+(isO()?"":" (max "+D.maxDisc+"%)")+'" oninput="tot()"><select id="pay"><option>CASH</option><option>MPESA</option><option>CARD</option><option>BANK</option><option value="CREDIT">CREDIT (pay later)</option></select></div>'+
 '<input id="cust" placeholder="Customer name/phone (07xx… for receipt)"><div class="row"><span>TOTAL</span><span class="tot" id="tt" style="text-align:right">'+k(s0)+'</span></div><button onclick="checkout()">✅ Complete Sale</button><button class="g" onclick="cart=[];render()">Clear cart</button>':'<div class="mu">Tap a product to add it.</div>')+'</div>'}
function tot(){$("tt").textContent=k(Math.max(0,sub()-(+v("disc")||0)))}
function keep(){var s=q;render();var e=$("q");e.focus();e.setSelectionRange(s.length,s.length)}

/* ---- STOCK ---- */
function addP(){var n=v("pn"),c=v("pc")||catOf(n),co=+v("pk"),pr=+v("pp")||sugg(co,c);if(!n||pr<=0)return say("Enter name and cost or price");
 if(pr<co&&!confirm("Price is below cost. Continue?"))return;D.P.push({id:D.n++,t:Date.now(),n:n,c:c,cost:co||0,price:pr,stock:Math.floor(+v("ps"))||0,min:Math.floor(+v("pm"))||minFor(c,+v("ps"))});lg("Added product "+n);save();say("Product added")}
function restock(id){var x=Math.floor(+prompt("Add how many units to "+P(id).n+"?"));if(x>0){P(id).stock+=x;lg("Restocked "+P(id).n+" +"+x);save();say("Stock updated")}}
function edit(id){var p=P(id),c=prompt("Cost price",p.cost);if(c===null)return;var s=prompt("Selling price",p.price);if(s===null)return;if(!(+s>0))return say("Price must be above 0");p.cost=+c||0;p.price=+s;lg("Price change "+p.n);save();render()}
function del(id){if(confirm("Delete this product?")){lg("Deleted "+P(id).n);D.P=D.P.filter(function(p){return p.id!=id});save();render()}}
function vStock(){var val=D.P.reduce(function(a,p){return a+p.stock*p.cost},0),low=D.P.filter(function(p){return p.stock<=p.min}),o=isO();
 return(o?'<div class="grid"><div class="card"><div class="mu">Stock value (cost)</div><div class="b">'+k(val)+'</div></div><div class="card"><div class="mu">Low / out</div><div class="b '+(low.length?"low":"")+'">'+low.length+' items</div></div></div>'+
 aiCard()+'<div class="card"><h3>➕ Add product</h3><input id="pn" placeholder="Name e.g. Tecno Spark 20"><div class="row"><input id="pc" placeholder="Category"><input id="ps" type="number" placeholder="Qty"></div><div class="row"><input id="pk" type="number" placeholder="Cost"><input id="pp" type="number" placeholder="Price (auto)"><input id="pm" type="number" placeholder="Reorder (auto)"></div><button onclick="addP()">Save product</button></div>':'')+
 '<div class="card"><h3>Products ('+D.P.length+')</h3>'+(o?'<button class="g" onclick="autoMin()">🎯 Auto-set reorder levels from sales</button>':'')+D.P.map(function(p){return'<div class="item"><div><div class="b">'+esc(p.n)+'</div><div class="mu">'+esc(p.c)+' · Price '+k(p.price)+(o?' · Cost '+k(p.cost)+' · Profit '+k(p.price-p.cost):'')+'</div><div class="'+(p.stock<=0?"out":p.stock<=p.min?"low":"")+'">'+p.stock+' left'+(p.stock<=p.min?" ⚠️":"")+'</div></div>'+(o?'<div style="min-width:74px"><button onclick="restock('+p.id+')">+Stock</button><button class="g" onclick="edit('+p.id+')">Edit</button><button class="g" onclick="del('+p.id+')">🗑</button></div>':'')+'</div>'}).join("")+'</div>'}

/* ---- SALES ---- */
function refund(id){var s=D.S.find(function(x){return x.id==id});if(s.ref||!confirm("Refund sale #"+id+" ("+k(s.total)+") and return items to stock?"))return;s.ref=true;s.rt=Date.now();s.items.forEach(function(i){var p=P(i.id);if(p)sa(p,s.br,i.q)});lg("Refund #"+id);save();render()}
function vSales(){var t=today(),L=D.S.filter(function(s){return day(s.t)==t&&(s.br||1)==CB&&(isO()||s.by==me.id)});
 return'<div class="card"><h3>'+(isO()?"Today's sales":"My sales today")+" · "+esc(bn(CB))+' ('+L.length+') · '+k(L.filter(function(s){return!s.ref}).reduce(function(a,s){return a+s.total},0))+'</h3>'+(L.map(function(s){return'<div class="item"><div><div class="b">#'+s.id+' · '+tm(s.t)+' <span class="tag">'+s.pay+'</span>'+(s.ref?' <span class="tag out">REFUNDED</span>':'')+'</div><div class="mu">'+s.items.map(function(i){return i.q+"x "+esc(i.n)}).join(", ")+' · '+esc(s.byn)+'</div><button class="g s" onclick="rc='+s.id+';render()">📤 Receipt</button>'+(isO()&&!s.ref?' <button class="g s" onclick="refund('+s.id+')">Refund</button>':'')+'</div><div class="b">'+k(s.total)+'</div></div>'}).join("")||'<div class="mu">No sales yet today.</div>')+'</div>'}

/* ---- MONEY ---- */
function addE(){var n=v("en"),a=+v("ea");if(!n||a<=0)return say("Enter reason and amount");D.E.unshift({id:D.n++,t:Date.now(),n:n,amt:a,by:me.name,br:CB});lg("Expense "+n+" "+k(a));save();render()}
function paid(id){var s=D.S.find(function(x){return x.id==id});var m=prompt("Paid by? CASH or MPESA","CASH");if(!m)return;s.paid=true;s.pt=Date.now();s.pm=m.toUpperCase();lg("Credit #"+id+" paid");save();render()}
function vMoney(){var t=today(),L=D.E.filter(function(e){return day(e.t)==t}),C=D.S.filter(function(s){return s.pay=="CREDIT"&&!s.paid&&!s.ref});
 return'<div class="card"><h3>➕ Expense</h3><input id="en" placeholder="Rent, transport, airtime, lunch…"><div class="row"><input id="ea" type="number" inputmode="numeric" placeholder="Amount"><button class="s" onclick="addE()">Save</button></div></div>'+
 '<div class="card"><h3>Today\'s expenses: '+k(L.reduce(function(a,e){return a+e.amt},0))+'</h3>'+(L.map(function(e){return'<div class="item"><span>'+esc(e.n)+' <span class="mu">'+tm(e.t)+'</span></span><b>'+k(e.amt)+'</b></div>'}).join("")||'<div class="mu">None yet.</div>')+'</div>'+
 '<div class="card"><h3>💳 Customers who owe you: '+k(C.reduce(function(a,s){return a+s.total},0))+'</h3>'+(C.map(function(s){return'<div class="item"><div><div class="b">'+esc(s.cust)+'</div><div class="mu">#'+s.id+' · '+day(s.t)+' · '+s.items.map(function(i){return i.q+"x "+esc(i.n)}).join(", ")+'</div><button class="s" onclick="paid('+s.id+')">Mark paid</button></div><div class="b">'+k(s.total)+'</div></div>'}).join("")||'<div class="mu">Nobody owes you.</div>')+'</div>'}

/* ---- AI INSIGHTS ---- */
